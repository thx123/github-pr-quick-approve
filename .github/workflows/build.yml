name: Build & Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate manifest
        run: |
          python3 -c "
          import json, sys
          m = json.load(open('manifest.json'))
          assert m['manifest_version'] == 3, 'Must be Manifest V3'
          assert 'name' in m, 'Missing name'
          assert 'version' in m, 'Missing version'
          assert 'content_scripts' in m, 'Missing content_scripts'
          print(f\"✓ {m['name']} v{m['version']}\")
          "

      - name: Check required files exist
        run: |
          for f in manifest.json content.js background.js options.html options.js icons/icon16.png icons/icon48.png icons/icon128.png; do
            test -f "$f" || { echo "Missing: $f"; exit 1; }
            echo "✓ $f"
          done

      - name: Build extension zip
        run: zip -r github-pr-quick-approve.zip . -x '.git/*' -x '.github/*' -x 'README.md' -x 'LICENSE' -x '.gitignore'

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: github-pr-quick-approve
          path: github-pr-quick-approve.zip

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Get version from tag
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Build extension zip
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: zip -r "github-pr-quick-approve-${VERSION}.zip" . -x '.git/*' -x '.github/*' -x 'README.md' -x 'LICENSE' -x '.gitignore'

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: github-pr-quick-approve-${{ steps.version.outputs.version }}.zip
          generate_release_notes: true
